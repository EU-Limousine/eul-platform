name: CI

# Checks every pull request (into develop or main) and is reused by both deploy workflows,
# so nothing is deployed that did not pass type checks, unit tests and a full build.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma schema is valid
        run: npx -w @eul/db prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Type check, unit tests, build
        run: npx turbo run typecheck test build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format (run "terraform fmt -recursive" to fix)
        run: terraform fmt -check -recursive -diff
        continue-on-error: true
      - name: Validate (no cloud access needed)
        run: |
          terraform init -backend=false -input=false
          terraform validate
