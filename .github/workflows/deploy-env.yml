name: Deploy one environment

# Reusable: build the three images for one environment and run infrastructure/gcp/deploy.sh.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }  # staging | production
      ref: { type: string, required: true }
      seed: { type: boolean, default: false }

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false # never stop a release halfway through a migration
    env:
      EUL_ENV: ${{ inputs.environment }}
      TAG: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check project
        run: |
          source infrastructure/gcp/config.sh
          [ "$PROJECT_ID" = "${{ vars.GCP_PROJECT_ID }}" ] || { echo "config.sh says $PROJECT_ID but GitHub environment says ${{ vars.GCP_PROJECT_ID }}"; exit 1; }

      - name: Build and push images
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          source infrastructure/gcp/config.sh
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

          docker build -f apps/api/Dockerfile -t "$IMAGE_BASE/backend:$TAG" .

          # NEXT_PUBLIC_* values are public and baked into the website at build time.
          docker build -f apps/website/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="https://${API_HOST}" \
            --build-arg SITE_URL="https://${WEB_HOST}" \
            --build-arg NEXT_PUBLIC_DEFAULT_CURRENCY="$DEFAULT_CURRENCY" \
            --build-arg NEXT_PUBLIC_HOME_VARIANT="$HOME_VARIANT" \
            --build-arg NEXT_PUBLIC_CONSENT_CATEGORIES="$CONSENT_CATEGORIES" \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            -t "$IMAGE_BASE/web:$TAG" .

          # The dashboard reads its API URL at container start (40-config.sh).
          docker build -f apps/dashboard/Dockerfile -t "$IMAGE_BASE/dashboard:$TAG" .

          docker push "$IMAGE_BASE/backend:$TAG"
          docker push "$IMAGE_BASE/web:$TAG"
          docker push "$IMAGE_BASE/dashboard:$TAG"

      - name: Migrate and deploy
        run: bash infrastructure/gcp/deploy.sh "$TAG" ${{ inputs.seed && '--seed' || '' }}
