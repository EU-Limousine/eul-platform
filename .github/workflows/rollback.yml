name: Rollback

# Manual emergency button: Actions → Rollback → choose the environment → Run.
# Moves all traffic back to the previous release (code only; the database is not touched).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to roll back'
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}   # waits only for a running deploy job
      cancel-in-progress: false
    env:
      EUL_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: bash infrastructure/gcp/rollback.sh
      - run: bash infrastructure/gcp/smoke.sh "$EUL_ENV"
