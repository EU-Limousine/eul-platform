# Local development only: Postgres 17 + Redis 7.
# Postgres is on host port 5433 because a Windows PostgreSQL service often holds 5432.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: eul
      POSTGRES_PASSWORD: eul
      POSTGRES_DB: eul
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eul']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'

  # Catches every email the worker sends. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
