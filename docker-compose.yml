services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: eul
      POSTGRES_PASSWORD: eul
      POSTGRES_DB: eul
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
volumes:
  pgdata:
